# 校園拾光 — 純靜態網站，沒有建置步驟
[build]
  publish = "."

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# 2026v25 資安標頭：不准被別的網站嵌入（點擊劫持）、不猜檔案類型、只送出網域、不准用相機／麥克風／定位、只走 HTTPS
# （網頁本身另有 CSP <meta>：只准連到清單上的網站）
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000"

# 2026v27 資安：舊版本（versions/）有已修正的漏洞，又跟新版同一個網站（共用瀏覽器裡的 Gemini Key、相簿庫權限）
# → 網站上不再提供，一律轉到目前版本；舊版只留在 GitHub 備查
[[redirects]]
  from = "/versions/*"
  to = "/"
  status = 301
  force = true
